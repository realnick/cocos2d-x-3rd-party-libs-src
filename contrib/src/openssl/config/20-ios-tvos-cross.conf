## -*- mode: perl; -*-
## iOS and tvOS configuration targets.
##
## These cover what openssl's own Configurations/15-ios.conf does not: armv7s
## (its "ios-cross" hardcodes -arch armv7, so armv7s built through it silently
## produces armv7 objects), the simulator arches as cross targets driven by
## CROSS_TOP/CROSS_SDK rather than `xcrun -sdk iphonesimulator`, and tvOS,
## which openssl has no targets for at all.
##
## Written for the OpenSSL 3.x Configurations format: the assembly
## implementation is selected with the `asm_arch` attribute. The `asm("...")`
## helper 1.1.1 used here no longer exists -- a target still calling it dies
## with "Undefined subroutine &main::asm" before configuring anything.

my %targets = (
    ## Base for both, on top of openssl's own ios-common (which pulls in
    ## darwin-common, sets sys_id and disables async).
    "ios-tvos-cross-base" => {
        template         => 1,
        inherit_from     => [ "ios-common" ],
        cflags           => add('-isysroot $(CROSS_TOP)/SDKs/$(CROSS_SDK) -fno-common'),
    },

    "ios-cross-base" => {
        inherit_from     => [ "ios-tvos-cross-base" ],
        template         => 1,
        cflags           => add(sub { defined($ENV{'IOS_MIN_SDK_VERSION'}) ? '-mios-version-min=$(IOS_MIN_SDK_VERSION)' : '-mios-version-min=6.0'; }),
    },

    ## tvOS additionally has to skip the functionality that needs fork().
    "tvos-cross-base" => {
        inherit_from     => [ "ios-tvos-cross-base" ],
        template         => 1,
        cflags           => add(sub { defined($ENV{'TVOS_MIN_SDK_VERSION'}) ? '-mtvos-version-min=$(TVOS_MIN_SDK_VERSION)' : '-mtvos-version-min=9.0'; }),
        defines          => [ "HAVE_FORK=0" ],
    },

    ## Apple iOS device
    "ios-cross-armv7" => {
        inherit_from     => [ "ios-cross-base" ],
        cflags           => add("-arch armv7"),
        asm_arch         => 'armv4',
        perlasm_scheme   => "ios32",
    },

    "ios-cross-armv7s" => {
        inherit_from     => [ "ios-cross-base" ],
        cflags           => add("-arch armv7s"),
        asm_arch         => 'armv4',
        perlasm_scheme   => "ios32",
    },

    "ios64-cross-arm64" => {
        inherit_from     => [ "ios-cross-base" ],
        cflags           => add("-arch arm64"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },

    ## Apple iOS simulator
    "ios-sim-cross-i386" => {
        inherit_from     => [ "ios-cross-base" ],
        cflags           => add("-arch i386"),
        bn_ops           => "BN_LLONG",
        asm_arch         => 'x86',
        perlasm_scheme   => "macosx",
    },

    "ios-sim-cross-x86_64" => {
        inherit_from     => [ "ios-cross-base" ],
        cflags           => add("-arch x86_64"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'x86_64',
        perlasm_scheme   => "macosx",
    },

    ## Apple Silicon Macs run the simulator on arm64, which is a different
    ## platform from the arm64 device even though the arch name is the same.
    "ios-sim-cross-arm64" => {
        inherit_from     => [ "ios-cross-base" ],
        cflags           => add("-arch arm64"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },

    ## Apple tvOS
    "tvos64-cross-arm64" => {
        inherit_from     => [ "tvos-cross-base" ],
        cflags           => add("-arch arm64"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG RC4_CHAR",
        asm_arch         => 'aarch64',
        perlasm_scheme   => "ios64",
    },

    "tvos-sim-cross-x86_64" => {
        inherit_from     => [ "tvos-cross-base" ],
        cflags           => add("-arch x86_64"),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        asm_arch         => 'x86_64',
        perlasm_scheme   => "macosx",
    },
);
